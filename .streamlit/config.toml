[theme]
base                     = "dark"
primaryColor             = "#2d8cf0"
backgroundColor          = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor                = "#e6edf3"
font                     = "sans serif"

[server]
# port and address are set via CLI flags in render.yaml (uses $PORT)
maxUploadSize   = 500
headless        = true
enableCORS      = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
